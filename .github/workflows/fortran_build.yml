name: CI
on: [push, pull_request]

env:
  BUILD_DIR: _build

jobs:
  gcc-meson-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            fc: gfortran-14
            cc: gcc-14
            lapack: openblas
          - os: ubuntu-22.04
            fc: gfortran-9
            cc: gcc-9
            lapack: netlib
          - os: ubuntu-22.04
            fc: gfortran-10
            cc: gcc-10
            lapack: netlib
          - os: ubuntu-22.04
            fc: gfortran-12
            cc: gcc-12
            lapack: netlib

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - name: Install OpenBLAS (OSX)
      if: ${{ contains(matrix.os, 'macos') }}
      run: |
        brew install gcc@14 openblas
        echo "$(brew --prefix gcc@14)/bin" >> "$GITHUB_PATH"
        openblas_prefix=$(brew --prefix openblas)
        echo "PKG_CONFIG_PATH=$openblas_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "LDFLAGS=-L$openblas_prefix/lib"              >> "$GITHUB_ENV"
        echo "CPPFLAGS=-I$openblas_prefix/include"         >> "$GITHUB_ENV"
        
    - name: Install meson
      run: pip3 install meson==1.7.0 ninja cmake

    - name: Configure build
      run: >-
        meson setup ${{ env.BUILD_DIR }}
        --buildtype=release
        ${{ env.MESON_ARGS }}
      env:
        FC: ${{ matrix.fc }}
        CC: ${{ matrix.cc }}
        MESON_ARGS: -Dlapack=${{ matrix.lapack }}

    - name: Build project
      run: meson compile -C ${{ env.BUILD_DIR }}

    - name: Run unit tests
      run: meson test -C ${{ env.BUILD_DIR }} --print-errorlogs --no-rebuild -t 120 --suite cpx

  intel-meson-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        fc: [ifx]
        cc: [icx]
    env:
      FC: ${{ matrix.fc }}
      CC: ${{ matrix.cc }}
      APT_PACKAGES: >-
        intel-oneapi-compiler-fortran-2026.1
        intel-oneapi-compiler-dpcpp-cpp-2026.1
        intel-oneapi-mkl-2026.1
        intel-oneapi-mkl-devel-2026.1
        asciidoctor

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - run: pip3 install meson==1.7.0 ninja --user

    - name: Add Intel repository
      if: contains(matrix.os, 'ubuntu')
      run: |
        wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS-2023.PUB
        sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS-2023.PUB
        rm GPG-PUB-KEY-INTEL-SW-PRODUCTS-2023.PUB
        echo "deb https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt-get update

    - name: Install Intel oneAPI compiler
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get install ${APT_PACKAGES}
        source /opt/intel/oneapi/setvars.sh --force
        ifx_path=$(find /opt/intel/oneapi/compiler -name ifx -perm -111 -print | sort -V | tail -n 1)
        test -x "$ifx_path"
        ifx_root=$(cd "$(dirname "$ifx_path")/.." && pwd)
        ifx_lib="$ifx_root/lib"
        test -d "$ifx_lib"
        icx_path="$(dirname "$ifx_path")/icx"
        if ! test -x "$icx_path"; then
          icx_path=$(find /opt/intel/oneapi/compiler -name icx -perm -111 -print | sort -V | tail -n 1)
        fi
        test -x "$icx_path"
        export LIBRARY_PATH="$ifx_lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
        export LD_LIBRARY_PATH="$ifx_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        export FC="$ifx_path"
        export CC="$icx_path"
        echo "Using Intel Fortran compiler: $FC"
        echo "Using Intel C compiler: $CC"
        printenv >> "$GITHUB_ENV"
        echo "$(dirname "$ifx_path")" >> "$GITHUB_PATH"
        echo "$(dirname "$icx_path")" >> "$GITHUB_PATH"

    # Keep project libraries static while using shared Intel compiler runtimes.
    # libirc supplies the allocatable-descriptor runtime used by json-fortran.
    # Keep --no-as-needed active through ifx's automatically added runtimes:
    # libifcoremt has transitive dependencies in libimf.
    - name: Configure meson build
      run: >-
        meson setup ${{ env.BUILD_DIR }}
        --prefix=/ --libdir=lib
        -Dfortran_link_args="-shared-intel -Wl,-Bdynamic -Wl,--no-as-needed -lirc"
        -Ddefault_library=static
        -Dlapack=mkl-rt

    - name: Build project
      run: ninja -C ${{ env.BUILD_DIR }}

    - name: Run unit tests
      run: >-
        meson test -C ${{ env.BUILD_DIR }}
        --print-errorlogs
        --num-processes 1
        --no-rebuild
        --suite cpx
        -t 12

  gcc-cmake-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        fc: [gfortran-10]
        cc: [gcc-10]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - name: Install CMake
      run: pip3 install ninja cmake==3.26.4

    - name: Configure build
      run: cmake -B ${{ env.BUILD_DIR }} -G Ninja
      env:
        FC: ${{ matrix.fc }}
        CC: ${{ matrix.cc }}

    - name: Build project
      run: cmake --build ${{ env.BUILD_DIR }}

    - name: Run unit tests
      run: ctest --parallel --output-on-failure -R cpcmx
      working-directory: ${{ env.BUILD_DIR }}
      env:
        OMP_NUM_THREADS: 2,1
